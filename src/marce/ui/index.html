<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>planê.mob · marcenaria paramétrica</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav id="abas" class="trilho" aria-label="Etapas"></nav>
  <main id="principal">
    <header class="cabecalho">
      <div class="titulo">
        <div class="linha-titulo"><input id="nome" class="nome" spellcheck="false" aria-label="Nome do móvel"><span id="badge-modo" class="badge-modo" hidden>editando</span></div>
        <div id="subtitulo" class="subtitulo"></div>
      </div>
      <nav id="vistas" class="segmentado" role="tablist"></nav>
    </header>
    <div id="rapida" class="rapida"></div>
    <section id="visao" class="cartao visao"></section>
    <div id="chips" class="chips"></div>
    <section id="conferencia" class="cartao conferencia"></section>
  </main>
  <aside id="painel">
    <div id="conteudo" class="conteudo"></div>
    <footer id="rodape" class="rodape"></footer>
  </aside>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="engine.js"></script>
<script src="nesting.js"></script>
<script src="catalogo.js"></script>
<script src="render.js"></script>
<script src="detalhes.js"></script>
<script src="report.js"></script>
<script src="ajuda.js"></script>
<script src="ilustra.js"></script>
<script src="app.js"></script>
</body>
</html>
